name: Deploy to one.com

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to one.com over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::SFTP secrets are not set, skipping upload."
            exit 0
          fi
          REMOTE_DIR="${SFTP_REMOTE_DIR:-/customers/2/2/f/c3svif7fk/webroots/www}"
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 3
          echo "Remote directory before upload:"
          cls -1 "$REMOTE_DIR"
          mirror --reverse --verbose --parallel=4 build/ "$REMOTE_DIR"
          bye
          LFTP
